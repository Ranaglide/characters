<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">

    <script src="js/api_manager.js" defer></script>
    <script src="js/dom_manager.js" defer></script>
    <script src="js/logic.js" defer></script>
    <script src="js/filters.js" defer></script>


    <link rel="shortcut icon" href="img/layout/favicon.ico" type="image/x-icon">

    <title>Ranaglide characters</title>
</head>

<body>
    <div id="overlay" class="overlay">
        <div class="overlay__background" id="overlay-bg"></div>
        <div class="overlay__panel">
            <img src="img/icons/close.svg" alt="" class="clickable" id="close-btn">
            <div class="panel__top">
                <div class="panel__img">
                    <img src="" alt="" class="panel__img-bg">
                    <img src="" alt="" class="panel__img-main">
                </div>
                <div class="panel__about">
                    <div class="panel__general-info">
                        <div class="general__identifier">
                            <div class="general__name">
                                
                            </div>
                            <div class="general__title">
                                
                            </div>
                        </div>
                        <div class="character__info">
                            <div class="character__stars">
                                
                            </div>
                            <div class="character__fighting">
                                <img class="character__weapon" src="" alt="">
                                <img class="character__element" src="" alt="">
                            </div>
                        </div>
                    </div>
                    <p class="panel__fact panel__description">
                    </p>
                    <p class="panel__fact panel__birthday"></p>
                    <p class="panel__fact panel__nation"></p>
                </div>
            </div>
            <div class="panel__talents">
                <div class="talents__heading">Talents</div>
                <div class="talents__wrapper">
                    
                </div>
            </div>
        </div>
    </div>
    <header>
        <div class="container">
            <div class="header__wrapper wrapper">
                <a class="logo" href="index.html">
                    <img class="logo__desktop" src="img/layout/logo desktop.svg" alt="">
                    <img class="logo__mobile" src="img/layout/logo mobile.svg" alt="">
                </a>
            </div>
        </div>
    </header>
    <main>

        <section class="list">
            <div class="container">
                <h2>List</h2>
                <div class="filters">
                    <div class="filters__item">
                        <h3>Element</h3>
                        <div id="filter-elements" class="elements">
                            <img class="clickable active" vision="pyro" src="img/elements/pyro.png" alt="">
                            <img class="clickable active" vision="hydro" src="img/elements/hydro.png" alt="">
                            <img class="clickable active" vision="anemo" src="img/elements/anemo.png" alt="">
                            <img class="clickable active" vision="electro" src="img/elements/electro.png" alt="">
                            <img class="clickable active" vision="dendro" src="img/elements/dendro.png" alt="">
                            <img class="clickable active" vision="cryo" src="img/elements/cryo.png" alt="">
                            <img class="clickable active" vision="geo" src="img/elements/geo.png" alt="">
                        </div>
                    </div>
                    <div class="filters__item">
                        <h3>Weapon</h3>
                        <div id="filter-weapons" class="weapons">
                            <img class="clickable active" weapon="claymore" src="img/weapons/claymore.png" alt="">
                            <img class="clickable active" weapon="sword" src="img/weapons/sword.png" alt="">
                            <img class="clickable active" weapon="bow" src="img/weapons/bow.png" alt="">
                            <img class="clickable active" weapon="polearm" src="img/weapons/polearm.png" alt="">
                            <img class="clickable active" weapon="catalyst" src="img/weapons/catalyst.png" alt="">
                        </div>
                    </div>
                </div>
                <div class="characters__list">
                    <h3>Characters</h3>
                    <div class="loader" id="list-loader"></div>
                    <div class="characters__wrapper" id="list">
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="logo">Ranaglide 2026</div>
    </footer>
</body>

</html>
