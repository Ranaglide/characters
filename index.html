<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">

    <title>Ranaglide characters</title>
</head>

<body>
    <header>
        <div class="container">
            <div class="header__wrapper wrapper">
                <a class="logo logo__desktop" href="index.html">
                    <img src="img/layout/logo desktop.svg" alt="">
                </a>
            </div>
        </div>
    </header>
    <main>

        <section class="list">
            <div class="container">
                <h2>List</h2>
                <div class="filters">
                    <div class="filters__element">
                        <h3>Element</h3>
                        <div class="elements">
                            <img class="clickable" src="img/elements/pyro.png" alt="">
                            <img class="clickable" src="img/elements/hydro.png" alt="">
                            <img class="clickable" src="img/elements/anemo.png" alt="">
                            <img class="clickable" src="img/elements/electro.png" alt="">
                            <img class="clickable" src="img/elements/dendro.png" alt="">
                            <img class="clickable" src="img/elements/cryo.png" alt="">
                            <img class="clickable" src="img/elements/geo.png" alt="">
                        </div>
                    </div>
                    <div class="filters__weapon">
                        <h3>Weapon</h3>
                        <div class="weapons">
                            <img class="clickable" src="img/weapons/claymore.png" alt="">
                            <img class="clickable" src="img/weapons/sword.png" alt="">
                            <img class="clickable" src="img/weapons/bow.png" alt="">
                            <img class="clickable" src="img/weapons/polearm.png" alt="">
                            <img class="clickable" src="img/weapons/catalyst.png" alt="">
                        </div>
                    </div>
                </div>
                <div class="characters__list">

                </div>
            </div>
        </section>
    </main>
    <footer>

    </footer>
</body>

</html>
